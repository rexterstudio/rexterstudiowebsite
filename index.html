<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rexter Studio — Advertisement Studio</title>
  <meta name="description" content="Rexter Studio is a creative advertisement studio. Website coming soon." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="Assets/Asset 1@4x.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Particle canvas background -->
  <canvas id="particles"></canvas>

  <!-- Logo top-left -->
  <div class="logo-topbar" id="logo">
    <img src="Assets/Asset 1@4x.png" alt="Rexter Studio Logo" class="logo-img" />
  </div>

  <!-- Hero Section -->
  <section class="hero" id="hero">
    <!-- Glow orbs -->
    <div class="glow-orb glow-orb--1"></div>
    <div class="glow-orb glow-orb--2"></div>
    <div class="glow-orb glow-orb--3"></div>

    <div class="hero__content">

      <h1 class="hero__title" id="heroTitle">
        <span class="title-line">Something Amazing</span>
        <span class="title-line">Is <em>Coming Soon</em></span>
      </h1>

      <p class="hero__subtitle" id="heroSubtitle">
        We're building something extraordinary. Our website is currently under construction.
        Stay tuned for the big reveal.
      </p>

      <!-- Divider -->
      <div class="divider"></div>

      <!-- Bottom tag -->
      <p class="hero__footer">
        <span class="pulse-dot"></span>
        Under Construction
      </p>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
